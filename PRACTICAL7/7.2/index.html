<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Case Study 7 - Event Handling in JavaScript</title>
    <style>
        * { box-sizing: border-box; }

        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            display: flex;
            justify-content: center;
            padding: 30px;
            min-height: 100vh;
        }

        .page-wrapper {
            display: flex;
            gap: 30px;
            align-items: flex-start;
            width: 100%;
            max-width: 900px;
        }

        /* ── LEFT: Registration Form ── */
        .form-container {
            background: #fff;
            padding: 25px 35px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.15);
            width: 420px;
            flex-shrink: 0;
        }

        h2 {
            text-align: center;
            margin-top: 0;
        }

        .mandatory {
            color: red;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .field {
            margin-bottom: 14px;
        }

        label {
            display: block;
            margin-bottom: 4px;
            font-weight: bold;
        }

        input[type="text"],
        input[type="password"],
        input[type="email"],
        input[type="url"],
        select {
            width: 100%;
            padding: 6px;
            border: 1px solid #999;
            border-radius: 4px;
        }

        .dob-row {
            display: flex;
            gap: 8px;
        }

        .dob-row select { flex: 1; }

        .error {
            color: red;
            font-size: 12px;
            margin-top: 3px;
            min-height: 14px;
        }

        .focused {
            border: 2px solid #2196F3 !important;
            background: #eef7ff;
        }

        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 15px;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #2196F3;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover { background: #1976D2; }

        #successMsg {
            color: green;
            text-align: center;
            margin-top: 10px;
            font-weight: bold;
        }

        /* ── RIGHT: Details Panel ── */
        .details-panel {
            background: #fff;
            padding: 25px 30px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.15);
            flex: 1;
            display: none;
            animation: slideIn 0.4s ease;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(20px); }
            to   { opacity: 1; transform: translateX(0); }
        }

        .details-panel h3 {
            margin-top: 0;
            color: #2196F3;
            border-bottom: 2px solid #2196F3;
            padding-bottom: 8px;
        }

        .details-panel table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        .details-panel table tr {
            border-bottom: 1px solid #eee;
        }

        .details-panel table tr:last-child {
            border-bottom: none;
        }

        .details-panel table td {
            padding: 9px 6px;
            vertical-align: top;
        }

        .details-panel table td:first-child {
            font-weight: bold;
            color: #555;
            width: 40%;
            white-space: nowrap;
        }

        .details-panel table td:last-child {
            color: #222;
            word-break: break-all;
        }

        #editBtn {
            background: #FF9800;
            margin-top: 18px;
        }

        #editBtn:hover { background: #F57C00; }

        .badge-success {
            display: inline-block;
            background: #e8f5e9;
            color: #388e3c;
            border: 1px solid #a5d6a7;
            border-radius: 20px;
            padding: 4px 14px;
            font-size: 13px;
            margin-bottom: 14px;
        }
    </style>
</head>

<body>

    <div class="page-wrapper">

        <!-- ── LEFT: Form ── -->
        <div class="form-container">
            <h2>Registration Form</h2>
            <p class="mandatory">*Mandatory to fill</p>

            <form id="regForm" novalidate>

                <div class="field">
                    <label for="firstname">Firstname *</label>
                    <input type="text" id="firstname" name="firstname">
                    <div class="error" id="err-firstname"></div>
                </div>

                <div class="field">
                    <label for="lastname">Lastname</label>
                    <input type="text" id="lastname" name="lastname">
                </div>

                <div class="field">
                    <label>Birthday</label>
                    <div class="dob-row">
                        <select id="day"><option value="">Day</option></select>
                        <select id="month"><option value="">Month</option></select>
                        <select id="year"><option value="">Year</option></select>
                    </div>
                    <div class="error" id="err-dob"></div>
                </div>

                <div class="field">
                    <label for="username">Username *</label>
                    <input type="text" id="username" name="username">
                    <div class="error" id="err-username"></div>
                </div>

                <div class="field">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email">
                    <div class="error" id="err-email"></div>
                </div>

                <div class="field">
                    <label for="website">Website</label>
                    <input type="url" id="website" name="website">
                </div>

                <div class="field">
                    <label for="password">Password *</label>
                    <input type="password" id="password" name="password">
                    <div class="error" id="err-password"></div>
                </div>

                <div class="field">
                    <label for="repassword">Re-password *</label>
                    <input type="password" id="repassword" name="repassword">
                    <div class="error" id="err-repassword"></div>
                </div>

                <div class="checkbox-row">
                    <input type="checkbox" id="terms">
                    <label for="terms" style="margin:0;font-weight:normal;">I agree to the terms &amp; conditions.</label>
                </div>
                <div class="error" id="err-terms"></div>

                <button type="submit" id="submitBtn">Submit</button>
                <p id="successMsg"></p>
            </form>
        </div>

        <!-- ── RIGHT: Submitted Details Panel ── -->
        <div class="details-panel" id="detailsPanel">
            <h3>&#10003; Submitted Details</h3>
            <span class="badge-success">Registration Successful</span>

            <table>
                <tr><td>First Name</td><td id="d-firstname">—</td></tr>
                <tr><td>Last Name</td><td id="d-lastname">—</td></tr>
                <tr><td>Birthday</td><td id="d-dob">—</td></tr>
                <tr><td>Username</td><td id="d-username">—</td></tr>
                <tr><td>E-mail</td><td id="d-email">—</td></tr>
                <tr><td>Website</td><td id="d-website">—</td></tr>
                <tr><td>Terms Agreed</td><td id="d-terms">—</td></tr>
            </table>

            <button type="button" id="editBtn">&#9998; Edit Details</button>
        </div>

    </div>

    <script>

        const form        = document.getElementById("regForm");
        const firstname   = document.getElementById("firstname");
        const lastname    = document.getElementById("lastname");
        const username    = document.getElementById("username");
        const email       = document.getElementById("email");
        const website     = document.getElementById("website");
        const password    = document.getElementById("password");
        const repassword  = document.getElementById("repassword");
        const terms       = document.getElementById("terms");
        const daySel      = document.getElementById("day");
        const monthSel    = document.getElementById("month");
        const yearSel     = document.getElementById("year");
        const successMsg  = document.getElementById("successMsg");
        const detailsPanel = document.getElementById("detailsPanel");

        const allInputs = document.querySelectorAll(
            "input[type='text'], input[type='email'], input[type='url'], input[type='password'], select"
        );

        // Populate DOB dropdowns
        for (let d = 1; d <= 31; d++) daySel.appendChild(new Option(d, d));

        const months = ["January","February","March","April","May","June",
                        "July","August","September","October","November","December"];
        months.forEach((m, i) => monthSel.appendChild(new Option(m, i + 1)));

        const currentYear = new Date().getFullYear();
        for (let y = currentYear; y >= currentYear - 100; y--) {
            yearSel.appendChild(new Option(y, y));
        }

        // Focus / blur highlight
        allInputs.forEach(input => {
            input.addEventListener("focus", () => input.classList.add("focused"));
            input.addEventListener("blur",  () => input.classList.remove("focused"));
        });

        function showError(id, msg) { document.getElementById(id).textContent = msg; }
        function clearError(id)     { document.getElementById(id).textContent = ""; }

        // Inline change validators
        firstname.addEventListener("change", () => {
            firstname.value.trim() === ""
                ? showError("err-firstname", "Firstname is required.")
                : clearError("err-firstname");
        });

        username.addEventListener("change", () => {
            username.value.trim() === ""
                ? showError("err-username", "Username is required.")
                : clearError("err-username");
        });

        email.addEventListener("change", () => {
            const p = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            email.value.trim() !== "" && !p.test(email.value.trim())
                ? showError("err-email", "Enter a valid email address.")
                : clearError("err-email");
        });

        repassword.addEventListener("change", () => {
            repassword.value !== password.value
                ? showError("err-repassword", "Passwords do not match.")
                : clearError("err-repassword");
        });

        // ── Submit handler ──
        form.addEventListener("submit", function (e) {
            e.preventDefault();
            let valid = true;

            if (firstname.value.trim() === "") {
                showError("err-firstname", "Firstname is required."); valid = false;
            } else { clearError("err-firstname"); }

            if (username.value.trim() === "") {
                showError("err-username", "Username is required."); valid = false;
            } else { clearError("err-username"); }

            const ep = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (email.value.trim() !== "" && !ep.test(email.value.trim())) {
                showError("err-email", "Enter a valid email address."); valid = false;
            } else { clearError("err-email"); }

            if (daySel.value === "" || monthSel.value === "" || yearSel.value === "") {
                showError("err-dob", "Please select your full date of birth."); valid = false;
            } else { clearError("err-dob"); }

            if (password.value.trim() === "") {
                showError("err-password", "Password is required."); valid = false;
            } else if (password.value.length < 6) {
                showError("err-password", "Password must be at least 6 characters."); valid = false;
            } else { clearError("err-password"); }

            if (repassword.value.trim() === "") {
                showError("err-repassword", "Please re-enter your password."); valid = false;
            } else if (repassword.value !== password.value) {
                showError("err-repassword", "Passwords do not match."); valid = false;
            } else { clearError("err-repassword"); }

            if (!terms.checked) {
                showError("err-terms", "You must agree to the terms & conditions."); valid = false;
            } else { clearError("err-terms"); }

            if (valid) {
                // Populate details panel
                document.getElementById("d-firstname").textContent = firstname.value.trim();
                document.getElementById("d-lastname").textContent  = lastname.value.trim() || "—";
                document.getElementById("d-dob").textContent =
                    daySel.value + " " + months[monthSel.value - 1] + " " + yearSel.value;
                document.getElementById("d-username").textContent  = username.value.trim();
                document.getElementById("d-email").textContent     = email.value.trim() || "—";
                document.getElementById("d-website").textContent   = website.value.trim() || "—";
                document.getElementById("d-terms").textContent     = "Yes";

                // Show panel & disable form
                detailsPanel.style.display = "block";
                successMsg.textContent = "Form submitted successfully!";
                allInputs.forEach(el => el.disabled = true);
                document.getElementById("submitBtn").style.display = "none";
            } else {
                successMsg.textContent = "";
            }
        });

        // ── Edit button: re-enable form, hide panel ──
        document.getElementById("editBtn").addEventListener("click", function () {
            allInputs.forEach(el => el.disabled = false);
            successMsg.textContent = "";
            detailsPanel.style.display = "none";
            document.getElementById("submitBtn").style.display = "block";
        });

    </script>

</body>

</html>
